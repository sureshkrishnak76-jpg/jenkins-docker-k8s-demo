apiVersion: apps/v1
kind: Deployment

metadata:
  name: jenkins-k8s-demo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: jenkins-k8s-demo

  template:
    metadata:
      labels:
        app: jenkins-k8s-demo

    spec:
      containers:
        - name: web
          image: sureshkrishnak/jenkins-k8s-demo:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service

metadata:
  name: jenkins-k8s-demo-service

spec:
  type: NodePort

  selector:
    app: jenkins-k8s-demo

  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
